name: Android CI (Quick)

# Workflow سريع للتحقق من صحة الكود بدون بناء APK كامل
# استخدم build.yml للبناء الكامل وتحميل APK

on:
  push:
    branches: [ main ]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - 'gradle/**'
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 35
        uses: android-actions/setup-android@v3

      - name: 🔧 Grant execute permission
        run: chmod +x gradlew

      - name: ✅ Verify manifest
        run: python3 tools/verify_manifest.py app/src/main/assets/models/manifest.json

      - name: 🧪 Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 🔍 Lint check
        run: ./gradlew :app:lintDebug --no-daemon --continue || true

      - name: ⬆️ Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-test-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
