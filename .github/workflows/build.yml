name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        id: build
        run: |
          set -o pipefail
          rm -rf app/build
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: 💬 Create issue with log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('/tmp/build.log', 'utf8');
            } catch(e) {
              log = 'Failed to read log: ' + e.message;
            }
            // Find actual errors - look for Execution failed, e:, error, etc
            const lines = log.split('\n');
            let errorLines = [];
            let inError = false;
            for(let i=0; i<lines.length; i++) {
              const line = lines[i];
              if(/Execution failed|e: |error:|FAILED|Exception/.test(line)) {
                // Capture 10 lines before and 20 after
                const start = Math.max(0, i-10);
                const end = Math.min(lines.length, i+20);
                errorLines.push(...lines.slice(start, end));
                errorLines.push('---');
                if(errorLines.length > 200) break;
              }
            }
            const errors = errorLines.join('\n').slice(0, 8000);
            const tail = lines.slice(-100).join('\n');
            const body = `## Build failed for ${{ github.sha }}\n\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n### Errors (first 8000 chars)\n\`\`\`\n${errors}\n\`\`\`\n\n### Last 100 lines\n\`\`\`\n${tail}\n\`\`\``;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build failed ${{ github.sha }} - ${{ github.run_id }}`,
              body: body
            });

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
