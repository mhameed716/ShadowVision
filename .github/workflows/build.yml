name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          echo "=== APKs ==="
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK"
          echo "=== Build dir files ==="
          find app/build -type f | head -100 || echo "No build dir"
          echo "=== Last 50 ==="
          tail -50 /tmp/build.log

      - name: 📤 Push log to logs branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # Create logs branch content
          mkdir -p /tmp/logs
          cp /tmp/build.log /tmp/logs/build-${{ github.sha }}.log
          echo "# Build log ${{ github.sha }}" > /tmp/logs/README.md
          echo "" >> /tmp/logs/README.md
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> /tmp/logs/README.md
          echo "" >> /tmp/logs/README.md
          echo '```' >> /tmp/logs/README.md
          tail -200 /tmp/build.log >> /tmp/logs/README.md
          echo '```' >> /tmp/logs/README.md
          # Push to logs branch
          git fetch origin logs 2>&1 || echo "No logs branch yet"
          git checkout --orphan logs-temp || git checkout -b logs-temp
          git rm -rf . 2>&1 || true
          cp -r /tmp/logs/* . 2>&1 || true
          cp /tmp/build.log ./full-${{ github.sha }}.log 2>&1 || true
          git add . 2>&1
          git commit -m "log ${{ github.sha }}" 2>&1 || echo "Commit failed"
          git push origin logs-temp:logs --force 2>&1 || echo "Push failed"

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
