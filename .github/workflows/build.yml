name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
          - bundled
      include_bundled:
        description: 'بناء النسخة المدمجة مع النماذج (إذا وجدت)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (JDK 17 + SDK 35)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔍 Accept licenses & Install SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true
          sdkmanager --list_installed | grep -E "platforms;android-3[45]|build-tools" || true

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Grant execute permission
        run: chmod +x gradlew

      - name: ✅ Verify manifest
        run: python3 tools/verify_manifest.py app/src/main/assets/models/manifest.json

      - name: 🔍 Check for bundled models
        id: check-bundled
        run: |
          if ls app/src/main/assets/models/*.onnx 1> /dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✅ Found bundled models:"
            ls -lh app/src/main/assets/models/*.onnx
            du -sh app/src/main/assets/models/
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No bundled models found - building standard APK (<50MB)"
            echo "   For bundled APK (~1.1GB), place .onnx files in app/src/main/assets/models/"
          fi

      - name: 🔨 Build Standard Debug APK (<50MB)
        if: ${{ github.event.inputs.build_type != 'release' && github.event.inputs.build_type != 'bundled' }}
        run: |
          ./gradlew :app:assembleStandardDebug --stacktrace --no-daemon
          ls -lh app/build/outputs/apk/standard/debug/

      - name: 🔨 Build Bundled Debug APK (~1.1GB with models)
        if: ${{ steps.check-bundled.outputs.found == 'true' && (github.event.inputs.build_type == 'bundled' || github.event.inputs.build_type == 'both' || github.event.inputs.include_bundled == 'true') }}
        run: |
          ./gradlew :app:assembleBundledDebug --stacktrace --no-daemon
          ls -lh app/build/outputs/apk/bundled/debug/
          echo "Bundled APK contains models and works 100% offline from first launch"

      - name: 🔨 Build Release APKs
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: |
          ./gradlew :app:assembleStandardRelease --stacktrace --no-daemon
          if [ "${{ steps.check-bundled.outputs.found }}" == "true" ]; then
            ./gradlew :app:assembleBundledRelease --stacktrace --no-daemon || true
          fi

      - name: 🧪 Run unit tests
        run: ./gradlew :app:testStandardDebugUnitTest --no-daemon

      - name: 📏 APK Summary
        if: always()
        run: |
          echo "## 📦 APK Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Standard APK (تحميل النماذج عند أول فتح)" >> $GITHUB_STEP_SUMMARY
          echo "- الحجم: <50MB" >> $GITHUB_STEP_SUMMARY
          echo "- مناسب لـ Play Store" >> $GITHUB_STEP_SUMMARY
          echo "- النماذج 1.1GB تُنزّل مرة واحدة عبر Wi-Fi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "app/build/outputs/apk/bundled" ]; then
            echo "### Bundled APK (النماذج مدمجة)" >> $GITHUB_STEP_SUMMARY
            echo "- الحجم: ~1.1GB" >> $GITHUB_STEP_SUMMARY
            echo "- يعمل 100% بدون إنترنت من أول تشغيل" >> $GITHUB_STEP_SUMMARY
            echo "- مناسب للتوزيع المباشر" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### 📥 التحميل" >> $GITHUB_STEP_SUMMARY
          echo "من Artifacts في الأسفل" >> $GITHUB_STEP_SUMMARY

      - name: ⬆️ Upload Standard Debug APK
        if: always() && (hashFiles('app/build/outputs/apk/standard/debug/*.apk') != '')
        uses: actions/upload-artifact@v4
        with:
          name: Shadow306-standard-debug-${{ github.sha }}
          path: app/build/outputs/apk/standard/debug/*.apk
          retention-days: 30
          compression-level: 0

      - name: ⬆️ Upload Bundled Debug APK
        if: always() && (hashFiles('app/build/outputs/apk/bundled/debug/*.apk') != '')
        uses: actions/upload-artifact@v4
        with:
          name: Shadow306-bundled-debug-${{ github.sha }}
          path: app/build/outputs/apk/bundled/debug/*.apk
          retention-days: 30
          compression-level: 0

      - name: ⬆️ Upload Release APKs
        if: always() && (hashFiles('app/build/outputs/apk/*/release/*.apk') != '')
        uses: actions/upload-artifact@v4
        with:
          name: Shadow306-release-${{ github.sha }}
          path: app/build/outputs/apk/*/release/*.apk
          retention-days: 90
          compression-level: 0
