name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: |
          rm -rf app/build
          ./gradlew :app:assembleDebug --stacktrace --info --no-daemon 2>&1 | tee /tmp/build.log
          echo ""
          echo "=== Tasks ==="
          grep -E "assembleDebug|UP-TO-DATE|FROM-CACHE|BUILD SUCCESSFUL|BUILD FAILED" /tmp/build.log | tail -20
          echo ""
          echo "=== APKs ==="
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK"
          echo ""
          echo "=== Outputs ==="
          ls -R app/build/outputs/ 2>/dev/null | head -50 || echo "No outputs"
          echo ""
          echo "=== Intermediates ==="
          ls app/build/intermediates/ 2>/dev/null | head -20 || echo "No intermediates"
          echo ""
          echo "=== Full build file list ==="
          find app/build -type f 2>/dev/null | head -100 || echo "No build files"
          echo ""
          echo "=== Last 50 log ==="
          tail -50 /tmp/build.log

      - name: 📏 Summary
        if: always()
        run: |
          echo "## Build result" >> $GITHUB_STEP_SUMMARY
          if find app/build -name "*.apk" -type f | grep -q .; then
            echo "✅ APK found" >> $GITHUB_STEP_SUMMARY
            find app/build -name "*.apk" -exec ls -lh {} \; >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No APK" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "assembleDebug|UP-TO-DATE|FROM-CACHE|BUILD" /tmp/build.log | tail -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Build dir:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            find app/build -type f 2>/dev/null | head -50 >> $GITHUB_STEP_SUMMARY || echo "No build dir" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Last 100 log:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: ⬆️ Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ github.sha }}
          path: /tmp/build.log
          retention-days: 7
          if-no-files-found: ignore
