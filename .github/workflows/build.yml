name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --info 2>&1 | tee /tmp/build.log
          echo "=== APKs ==="
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK"
          echo "=== Build dir ==="
          find app/build -type f | head -100 || echo "No build dir"
          tail -50 /tmp/build.log

      - name: 📤 Debug push
        if: always()
        run: |
          echo "=== Trying to push log ==="
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git status
          echo "=== Remote ==="
          git remote -v
          echo "=== Trying push to logs ==="
          mkdir -p /tmp/logs
          cp /tmp/build.log /tmp/logs/build.log
          cd /tmp
          git clone https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git logs-repo || echo "Clone failed"
          cd logs-repo
          git checkout --orphan logs || git checkout -b logs
          cp /tmp/logs/build.log ./build-${{ github.sha }}.log
          echo "# Log ${{ github.sha }}" > README.md
          tail -100 /tmp/build.log >> README.md
          git add .
          git commit -m "log ${{ github.sha }}" || echo "Commit failed"
          git push origin logs --force 2>&1 || echo "Push failed with token"
          echo "=== Done ==="

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
