name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (JDK 17 + SDK 35)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true
          sdkmanager --list_installed | grep -E "platforms;android|build-tools" || true

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Grant execute permission
        run: chmod +x gradlew

      - name: ✅ Verify manifest
        run: |
          python3 tools/verify_manifest.py app/src/main/assets/models/manifest.json
          ls -lh app/src/main/assets/models/
          echo "Total models size: $(du -sh app/src/main/assets/models/ | cut -f1)"

      - name: 📊 Environment & Tasks
        run: |
          java -version
          ./gradlew --version
          echo ""
          echo "=== Available assemble tasks ==="
          ./gradlew tasks --all | grep -i assemble | head -30
          echo ""
          echo "=== Flavors ==="
          ./gradlew tasks --all | grep -E "standard|bundled" | head -20

      - name: 🔨 Build APKs (try all variants)
        run: |
          echo "=== Building Standard Debug ==="
          ./gradlew :app:assembleStandardDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build-standard.log | tail -50
          echo ""
          echo "=== Building Bundled Debug ==="
          ./gradlew :app:assembleBundledDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build-bundled.log | tail -50
          echo ""
          echo "=== Trying generic assembleDebug as fallback ==="
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build-generic.log | tail -50 || true
          echo ""
          echo "=== All APKs found ==="
          find . -name "*.apk" -type f 2>/dev/null | xargs ls -lh 2>/dev/null || echo "No APK found yet"
          echo ""
          echo "=== Build outputs ==="
          find app/build -type f 2>/dev/null | head -30 || echo "No build dir"
          echo ""
          echo "=== Build logs tail ==="
          cat /tmp/build-standard.log | grep -E "FAILED|SUCCESS|error|Error" | tail -20 || true

      - name: 📏 APK Summary
        if: always()
        run: |
          echo "## 📦 APK Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          APK_FOUND=false
          if find app/build -name "*.apk" -type f 2>/dev/null | grep -q .; then
            APK_FOUND=true
            echo "### ✅ APKs Built Successfully" >> $GITHUB_STEP_SUMMARY
            find app/build -name "*.apk" -type f -exec ls -lh {} \; | while read line; do
              echo "- $line" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📊 Sizes" >> $GITHUB_STEP_SUMMARY
            find app/build -name "*.apk" -type f -exec du -h {} \; | while read line; do
              echo "- $line" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "### ⚠️ No APK found" >> $GITHUB_STEP_SUMMARY
            echo "Checking build directory..." >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            find app/build -type f 2>/dev/null | head -30 >> $GITHUB_STEP_SUMMARY || echo "No build directory" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Build logs (last 50 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/build-standard.log | tail -50 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "adb install app-standard-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "adb install app-bundled-debug.apk  # With models, 100% offline" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: ⬆️ Upload APKs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APKs-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/**/*.apk
            **/build/outputs/apk/**/*.apk
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

      - name: ⬆️ Upload build logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ github.sha }}
          path: |
            /tmp/build-*.log
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore
