name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
          - bundled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (JDK 17 + SDK 35)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # إعداد Android SDK بدون استخدام android-actions/setup-android (لتجنب Node 20)
      - name: 🤖 Setup Android SDK 35 (manual)
        run: |
          echo "=== Android SDK Setup (manual, no Node.js action) ==="
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo ""
          
          # قبول التراخيص
          echo "Accepting licenses..."
          yes | sdkmanager --licenses || true
          
          echo ""
          echo "Installing SDK 35..."
          sdkmanager --install "platform-tools" || true
          sdkmanager --install "platforms;android-35" || echo "SDK 35 not available, trying 34"
          sdkmanager --install "platforms;android-34" || true
          sdkmanager --install "build-tools;35.0.0" || sdkmanager --install "build-tools;34.0.0" || true
          sdkmanager --install "build-tools;34.0.0" || true
          
          echo ""
          echo "Accepting licenses again..."
          yes | sdkmanager --licenses || true
          
          echo ""
          echo "=== Installed ==="
          sdkmanager --list_installed | grep -E "platforms;android|build-tools|platform-tools" || true
          ls -lh $ANDROID_HOME/platforms/ | tail -10 || true
          echo "SDK ready ✅"

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Grant execute permission
        run: chmod +x gradlew

      - name: ✅ Verify manifest
        run: |
          python3 tools/verify_manifest.py app/src/main/assets/models/manifest.json
          ls -lh app/src/main/assets/models/

      - name: 📊 Environment info
        run: |
          java -version
          echo ""
          ./gradlew --version || true
          echo ""
          echo "Gradle tasks (flavors):"
          ./gradlew tasks --all | grep -E "assemble.*Debug" | head -20 || true

      - name: 🔨 Build Standard Debug APK
        run: |
          echo "Building Standard Debug..."
          ./gradlew :app:assembleStandardDebug --stacktrace --no-daemon --info 2>&1 | tail -100
          echo ""
          echo "=== APKs found ==="
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || true

      - name: 🔨 Build Bundled Debug APK
        run: |
          echo "Building Bundled Debug..."
          ./gradlew :app:assembleBundledDebug --stacktrace --no-daemon 2>&1 | tail -100
          echo ""
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || true

      - name: 🧪 Run unit tests
        run: |
          ./gradlew :app:testStandardDebugUnitTest --no-daemon --stacktrace 2>&1 | tail -50 || true

      - name: 📏 APK Summary
        if: always()
        run: |
          echo "## 📦 APK Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find app/build -name "*.apk" -type f 2>/dev/null | while read apk; do
            size=$(du -h "$apk" | cut -f1)
            echo "- \`$apk\` ($size)" >> $GITHUB_STEP_SUMMARY
          done
          if [ ! -f app/build/outputs/apk/standard/debug/*.apk ] && [ ! -f app/build/outputs/apk/bundled/debug/*.apk ]; then
            echo "⚠️ No APK found, checking build outputs..." >> $GITHUB_STEP_SUMMARY
            find app/build -type f | head -20 >> $GITHUB_STEP_SUMMARY || true
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built with JDK 17 + Android SDK 35" >> $GITHUB_STEP_SUMMARY

      - name: ⬆️ Upload APKs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APKs-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/**/*.apk
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
