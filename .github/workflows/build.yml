name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        id: build
        run: |
          echo "=== Building Shadow306 Original - APK <50MB, downloads after install ==="
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo ""
          echo "=== APKs ==="
          find app/build -name "*.apk" -type f -exec ls -lh {} \; 2>/dev/null || echo "No APK"
          echo ""
          echo "=== Last 50 lines ==="
          tail -50 /tmp/build.log
          echo ""
          echo "=== Errors ==="
          grep -i -E "error|FAILED|exception|e: " /tmp/build.log | head -30 || echo "No errors grep"
          exit $EXIT_CODE

      - name: 📏 Summary on failure
        if: failure()
        run: |
          echo "## ❌ Build Failed - Shadow306" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Error log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -i -E "error|FAILED|exception|e: |Execution failed" /tmp/build.log | head -100 >> $GITHUB_STEP_SUMMARY || tail -100 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Full tail" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Also create annotation
          ERROR_MSG=$(grep -i -m1 -E "error|FAILED" /tmp/build.log | head -1 | cut -c1-500)
          echo "::error::$ERROR_MSG"

      - name: 📏 Summary on success
        if: success()
        run: |
          echo "## ✅ Shadow306 APK Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Original design: APK <50MB, models download after install, then 100% offline" >> $GITHUB_STEP_SUMMARY
          echo "Icon: shadow crescent + purple AI dot" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find app/build -name "*.apk" -type f -exec ls -lh {} \; | while read l; do echo "- $l" >> $GITHUB_STEP_SUMMARY; done

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: ⬆️ Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ github.sha }}
          path: /tmp/build.log
          retention-days: 7
          if-no-files-found: ignore
