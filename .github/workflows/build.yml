name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original - Download After Install)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: ✅ Verify
        run: |
          ls -lh app/src/main/assets/models/
          ls -lh app/src/main/res/mipmap-hdpi/ || echo "No hdpi"
          cat app/src/main/res/values/colors.xml | grep ic_launcher_background || echo "Missing background in colors"

      - name: 🔨 Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          echo "=== APKs ==="
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK"
          echo "=== Build dir ==="
          ls -R app/build/outputs/ 2>/dev/null | head -20 || echo "No outputs"
          echo "=== Last 50 ==="
          tail -50 /tmp/build.log

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: ⬆️ Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ github.sha }}
          path: /tmp/build.log
          retention-days: 7
          if-no-files-found: ignore
