name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: false

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: |
          echo "=== Clean ==="
          rm -rf app/build .gradle
          ./gradlew clean --no-daemon || true
          echo ""
          echo "=== Build with rerun-tasks and no cache ==="
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --rerun-tasks --no-build-cache --no-configuration-cache 2>&1 | tee /tmp/build.log
          echo ""
          echo "=== Result ==="
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK found"
          ls -lh app/build/outputs/apk/debug/ 2>&1 || echo "No debug dir"
          ls -R app/build/ 2>&1 | head -100 || echo "No build dir"
          tail -100 /tmp/build.log

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: ⬆️ Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ github.sha }}
          path: /tmp/build.log
          retention-days: 7
          if-no-files-found: ignore
