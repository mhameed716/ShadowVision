name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "=== BUILD FAILED - EXTRACTING ERROR ==="
            # Find the actual error - look for e: or Execution failed
            echo "=== First error ==="
            grep -m1 -A5 -B5 "e: " /tmp/build.log || grep -m1 -A5 -B5 "Execution failed" /tmp/build.log || tail -30 /tmp/build.log
            echo ""
            echo "=== Creating annotation with error ==="
            ERROR_LINE=$(grep -m1 "e: " /tmp/build.log | head -c 1000 || grep -m1 "Execution failed" /tmp/build.log | head -c 1000 || echo "Build failed, see log")
            echo "::error::$ERROR_LINE"
            # Also try to output full log tail as warning annotations (multiple)
            tail -20 /tmp/build.log | while read line; do
              echo "::warning::$line"
            done
          fi
          exit $EXIT_CODE

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
