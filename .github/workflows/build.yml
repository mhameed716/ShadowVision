name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original - Download After Install)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK - Original Design
        run: |
          echo "Building Shadow306 Original:"
          echo "- APK <50MB lightweight"
          echo "- Models 1.1GB download once via Wi-Fi after first launch"
          echo "- Then 100% offline"
          echo "- Icon: shadow crescent + purple AI dot adaptive"
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          echo ""
          echo "=== APKs ==="
          find app/build -name "*.apk" -type f -exec ls -lh {} \;

      - name: 📏 Summary
        if: always()
        run: |
          echo "## 📦 Shadow306 APK - Original Design" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **APK**: <50MB lightweight" >> $GITHUB_STEP_SUMMARY
          echo "- **Models**: 1.1GB download once via Wi-Fi after first launch (SetupScreen)" >> $GITHUB_STEP_SUMMARY
          echo "- **Offline**: 100% offline after setup" >> $GITHUB_STEP_SUMMARY
          echo "- **Icon**: Shadow crescent (privacy) + purple AI dot adaptive" >> $GITHUB_STEP_SUMMARY
          echo "- **Design**: Original as requested - downloads after install" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if find app/build -name "*.apk" -type f | grep -q .; then
            echo "### 📥 APKs" >> $GITHUB_STEP_SUMMARY
            find app/build -name "*.apk" -type f -exec ls -lh {} \; | while read l; do echo "- $l" >> $GITHUB_STEP_SUMMARY; done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download from Artifacts below" >> $GITHUB_STEP_SUMMARY
          fi

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
