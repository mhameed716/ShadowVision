name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== EXIT $EXIT_CODE ==="
          tail -100 /tmp/build.log
          exit $EXIT_CODE

      - name: 📤 Save log via API on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Saving log via GitHub API"
          # Encode log as base64
          base64 -w 0 /tmp/build.log > /tmp/b64.log || base64 /tmp/build.log > /tmp/b64.log
          # Create file in repo via API on a new branch
          # First get current commit sha
          SHA=$(git rev-parse HEAD)
          echo "Current SHA: $SHA"
          # Try to create file via API
          gh api repos/mhameed716/ShadowVision/contents/build-failure-${{ github.sha }}.log \
            -f message="build log ${{ github.sha }}" \
            -f content="$(cat /tmp/b64.log)" \
            -f branch="arena/529f00d7-shadowvision" \
            --method PUT || echo "API create failed"
          # Also try to update summary with full log
          echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -300 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
