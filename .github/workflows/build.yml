name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: |
          set -o pipefail
          rm -rf app/build
          echo "=== Building ==="
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "=== Exit code: $EXIT_CODE ==="
          echo ""
          echo "=== APKs ==="
          find app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK found - listing build dir"
          find app/build -type f | head -100 || echo "No build dir at all"
          echo ""
          echo "=== Last 50 ==="
          tail -50 /tmp/build.log
          echo ""
          echo "=== Grep BUILD ==="
          grep -E "BUILD|assembleDebug|UP-TO-DATE" /tmp/build.log | tail -20
          exit $EXIT_CODE

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: ⬆️ Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ github.sha }}
          path: /tmp/build.log
          retention-days: 7
          if-no-files-found: ignore
