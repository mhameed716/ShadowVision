name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (JDK 17 + SDK 35)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 35
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" "ndk;28.2.13676358" || true
          yes | sdkmanager --licenses || true
          sdkmanager --list_installed | grep -E "platforms;android|build-tools" || true

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Grant execute permission
        run: chmod +x gradlew

      - name: ✅ Verify manifest
        run: |
          python3 tools/verify_manifest.py app/src/main/assets/models/manifest.json
          ls -lh app/src/main/assets/models/ | head -20

      - name: 📊 Environment
        run: |
          java -version
          ./gradlew --version
          ./gradlew tasks --all | grep -E "assemble" | head -20

      - name: 🔨 Build Debug APK (Original - downloads after install)
        run: |
          echo "Building Shadow306 Debug APK - original design: downloads models after install"
          echo "This is the first app version as requested"
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache 2>&1 | tee /tmp/build.log
          echo ""
          echo "=== Build result ==="
          echo "Exit code: ${PIPESTATUS[0]}"
          echo ""
          echo "=== APKs ==="
          find . -name "*.apk" -type f 2>/dev/null | xargs ls -lh 2>/dev/null || echo "No APK yet"
          echo ""
          echo "=== Outputs ==="
          ls -R app/build/outputs/ 2>/dev/null | head -50 || echo "No outputs dir"
          echo ""
          echo "=== Check for errors ==="
          grep -E "FAILED|error|Error|Exception" /tmp/build.log | head -20 || true

      - name: 📏 Summary
        if: always()
        run: |
          echo "## 📦 Shadow306 APK - Original Design" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Original App: Downloads after install" >> $GITHUB_STEP_SUMMARY
          echo "- APK <50MB (lightweight)" >> $GITHUB_STEP_SUMMARY
          echo "- Models 1.1GB download once via Wi-Fi after first launch" >> $GITHUB_STEP_SUMMARY
          echo "- 100% offline after setup" >> $GITHUB_STEP_SUMMARY
          echo "- As requested: first version" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if find app/build -name "*.apk" -type f 2>/dev/null | grep -q .; then
            echo "### ✅ APK Built" >> $GITHUB_STEP_SUMMARY
            find app/build -name "*.apk" -type f -exec ls -lh {} \; | while read line; do
              echo "- $line" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "### ❌ Build Failed - Logs" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "FAILED|error|Error|Exception|Caused by" /tmp/build.log | head -30 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Full log tail:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 /tmp/build.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: ⬆️ Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ github.sha }}
          path: /tmp/build.log
          retention-days: 7
          if-no-files-found: ignore
