name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (JDK 17 + SDK 35)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true
          echo "SDK installed:"
          sdkmanager --list_installed | grep -E "platforms;android|build-tools" || true

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Grant execute permission
        run: chmod +x gradlew

      - name: ✅ Verify manifest
        run: |
          python3 tools/verify_manifest.py app/src/main/assets/models/manifest.json
          echo "Models:"
          ls -lh app/src/main/assets/models/ | head -20
          du -sh app/src/main/assets/models/

      - name: 📊 List available tasks
        run: |
          echo "=== Available tasks ==="
          ./gradlew tasks --all 2>&1 | grep -E "assemble" | head -30
          echo ""
          echo "=== Build files ==="
          ls -lh app/build.gradle.kts gradle/libs.versions.toml

      - name: 🔨 Build Debug APK
        run: |
          echo "=== Building Debug APK ==="
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache 2>&1 | tee /tmp/build.log
          echo ""
          echo "=== Build finished, exit code: ${PIPESTATUS[0]} ==="
          echo ""
          echo "=== Searching for APKs ==="
          find . -name "*.apk" -type f 2>/dev/null | head -20
          echo ""
          echo "=== App build outputs ==="
          ls -R app/build/outputs/ 2>/dev/null | head -50 || echo "No outputs"
          echo ""
          echo "=== Full build directory ==="
          find app/build -type f 2>/dev/null | head -50 || echo "No build dir"
          echo ""
          echo "=== Last 30 lines of build log ==="
          tail -30 /tmp/build.log

      - name: 📏 APK Summary
        if: always()
        run: |
          echo "## 📦 Shadow306 APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- JDK: 17" >> $GITHUB_STEP_SUMMARY
          echo "- SDK: 35" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if find app/build -name "*.apk" -type f 2>/dev/null | grep -q .; then
            echo "### ✅ APKs Found" >> $GITHUB_STEP_SUMMARY
            find app/build -name "*.apk" -type f -exec ls -lh {} \; | while read line; do
              echo "- $line" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📱 Installation" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "adb install app-debug.apk" >> $GITHUB_STEP_SUMMARY
            echo "# Or drag APK to phone and install" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ No APK Found" >> $GITHUB_STEP_SUMMARY
            echo "Build directory contents:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            find app/build -type f 2>/dev/null | head -50 >> $GITHUB_STEP_SUMMARY || echo "No build dir" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Last 50 lines of build log:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 /tmp/build.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: ⬆️ Upload APKs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/**/*.apk
            **/build/outputs/apk/**/*.apk
            app/build/**/*.apk
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

      - name: ⬆️ Upload build logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ github.sha }}
          path: |
            /tmp/build.log
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore
