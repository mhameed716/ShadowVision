name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original - Download After Install)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: ✅ Verify manifest + Icon
        run: |
          echo "=== Manifest ==="
          cat app/src/main/assets/models/manifest.json | head -20
          echo ""
          echo "=== Icon ==="
          ls -lh app/src/main/res/drawable/ic_launcher_foreground.xml
          ls -lh app/src/main/res/mipmap-anydpi-v26/
          echo ""
          echo "=== Assets ==="
          ls -lh app/src/main/assets/models/

      - name: 🔨 Build Debug APK
        run: |
          echo "=== Clean ==="
          ./gradlew clean --no-daemon 2>&1 | tail -5
          echo ""
          echo "=== Build with rerun-tasks ==="
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --rerun-tasks 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "=== Exit code: $EXIT_CODE ==="
          echo ""
          echo "=== Find APKs everywhere ==="
          find . -type f -name "*.apk" 2>/dev/null | xargs ls -lh 2>/dev/null || echo "No APK anywhere"
          echo ""
          echo "=== app/build ==="
          ls -R app/build 2>/dev/null | head -100 || echo "No build dir"
          echo ""
          echo "=== Last 30 lines ==="
          tail -30 /tmp/build.log
          exit $EXIT_CODE

      - name: 📏 Summary
        if: always()
        run: |
          echo "## 📦 Shadow306 APK - Original Design" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK <50MB, models download after install, then 100% offline" >> $GITHUB_STEP_SUMMARY
          echo "Icon: shadow crescent + AI dot adaptive" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if find app/build -name "*.apk" -type f | grep -q .; then
            echo "### ✅ SUCCESS - APK Built" >> $GITHUB_STEP_SUMMARY
            find app/build -name "*.apk" -type f -exec ls -lh {} \; | while read l; do echo "- $l" >> $GITHUB_STEP_SUMMARY; done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download from Artifacts below" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ FAILED - No APK" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Build dir structure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls -R app/build 2>/dev/null | head -150 >> $GITHUB_STEP_SUMMARY || echo "No build dir" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Last 150 lines of log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -150 /tmp/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -i -E "error|failed|exception|FAILED" /tmp/build.log | head -50 >> $GITHUB_STEP_SUMMARY || echo "No explicit errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/**/*.apk
            **/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: ⬆️ Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ github.sha }}
          path: /tmp/build.log
          retention-days: 7
          if-no-files-found: ignore
