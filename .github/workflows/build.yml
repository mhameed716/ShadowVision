name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        id: build
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          tail -100 /tmp/build.log
          exit $EXIT_CODE

      - name: 💬 Comment with error on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('/tmp/build.log', 'utf8');
            } catch(e) {
              log = 'Could not read log: ' + e.message;
            }
            const tail = log.split('\n').slice(-150).join('\n');
            const errors = log.split('\n').filter(l => /error|FAILED|exception|e: /i.test(l)).slice(0, 50).join('\n');
            const body = `## ❌ Build Failed for ${{ github.sha }}\n\n### Errors\n\`\`\`\n${errors}\n\`\`\`\n\n### Last 150 lines\n\`\`\`\n${tail}\n\`\`\`\n\n[View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            // Try to create comment on commit
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: body
              });
            } catch(e) {
              console.log('Failed to create commit comment:', e.message);
              // Try issue comment if PR
              if(context.payload.pull_request) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: body
                });
              }
            }
            // Also set summary
            const summary = `## ❌ Build Failed\n\n\`\`\`\n${tail}\n\`\`\``;
            await core.summary.addRaw(summary).write();

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
