name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: |
          set -o pipefail
          rm -rf app/build
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Exit: $EXIT_CODE"
          exit $EXIT_CODE

      - name: 💬 Create issue with full log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = fs.readFileSync('/tmp/build.log', 'utf8');
            // Split into chunks of 60000 chars for multiple issues if needed
            const chunks = [];
            for(let i=0; i<log.length; i+=60000) {
              chunks.push(log.slice(i, i+60000));
            }
            // First chunk with errors
            const errorLines = log.split('\n').filter(l => /e: |error:|FAILED|Execution failed/.test(l)).slice(0, 100).join('\n');
            let body = `## Build failed ${{ github.sha }}\n\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n### First 100 error lines\n\`\`\`\n${errorLines}\n\`\`\`\n\n### Full log chunk 1/${chunks.length} (first 60000 chars)\n\`\`\`\n${chunks[0].slice(0, 60000)}\n\`\`\``;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build failed ${{ github.sha }} - ${{ github.run_id }}`,
              body: body
            });
            // If more chunks, create additional comments
            for(let i=1; i<Math.min(chunks.length, 3); i++) {
              await new Promise(r => setTimeout(r, 1000));
              try {
                const issues = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 1
                });
                const issue_number = issues.data[0].number;
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue_number,
                  body: `### Chunk ${i+1}/${chunks.length}\n\`\`\`\n${chunks[i].slice(0, 60000)}\n\`\`\``
                });
              } catch(e) {}
            }

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
