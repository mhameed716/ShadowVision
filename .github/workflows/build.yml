name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Last 100 lines ==="
          tail -100 /tmp/build.log
          echo ""
          echo "=== Errors ==="
          grep -i -E "error|FAILED|exception|e: " /tmp/build.log | head -50 || echo "No errors"
          exit $EXIT_CODE

      - name: 📤 Save log to repo on failure
        if: failure()
        run: |
          echo "Build failed, saving log to repo for debugging"
          mkdir -p /tmp/logdir
          cp /tmp/build.log /tmp/logdir/build-${{ github.sha }}.log
          tail -200 /tmp/build.log > /tmp/logdir/last-failure.log
          echo "## Build failure ${{ github.sha }}" > /tmp/logdir/README.md
          echo "" >> /tmp/logdir/README.md
          echo '```' >> /tmp/logdir/README.md
          tail -200 /tmp/build.log >> /tmp/logdir/README.md
          echo '```' >> /tmp/logdir/README.md
          # Configure git
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # Create orphan branch for logs
          git checkout --orphan build-logs-temp || git checkout -b build-logs-temp
          git rm -rf . || true
          cp /tmp/logdir/* . || true
          cp /tmp/build.log ./full.log || true
          git add .
          git commit -m "build log ${{ github.sha }}" || echo "No changes"
          git push origin build-logs-temp:build-logs --force || echo "Push failed"
          echo "Log pushed to build-logs branch"

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
