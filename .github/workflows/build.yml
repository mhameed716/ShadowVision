name: Build Shadow306 APK

# يبني الـ APK تلقائياً عند كل push - حمّل الـ APK من تبويب Actions
# يثبت بيئة أندرويد كاملة (JDK 17 + Android SDK 35) ويبني الـ APK في السحابة

on:
  push:
    branches: [ main, arena/**, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (JDK 17 + SDK 35)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # إعداد Android SDK بطريقة مستقرة - بدون تحديد إصدار cmdline-tools لتجنب مشكلة التراخيص
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔍 Accept licenses & Install SDK 35
        run: |
          echo "=== Accepting all licenses ==="
          # قبول جميع التراخيص تلقائياً
          yes | sdkmanager --licenses || true
          
          echo ""
          echo "=== Installing SDK 35 ==="
          # تثبيت SDK 35 والأساسيات
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" || true
          
          echo ""
          echo "=== Accepting licenses again after install ==="
          yes | sdkmanager --licenses || true
          
          echo ""
          echo "=== Installed packages ==="
          sdkmanager --list_installed | grep -E "platforms;android-3[45]|build-tools" || true
          echo ""
          echo "SDK 35 ready ✅"

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: ✅ Verify model manifest
        run: |
          echo "Checking manifest.json..."
          python3 tools/verify_manifest.py app/src/main/assets/models/manifest.json
          echo "Manifest OK ✅"

      - name: 📊 Environment info
        run: |
          echo "=== Java ==="
          java -version
          echo ""
          echo "=== Gradle ==="
          ./gradlew --version
          echo ""
          echo "=== Android SDK ==="
          ls -lh $ANDROID_HOME/platforms/ | grep android- || true
          echo ""

      - name: 🔨 Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
          echo "Debug APK built ✅"
          ls -lh app/build/outputs/apk/debug/
          du -sh app/build/outputs/apk/debug/*.apk

      - name: 🔨 Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace --no-daemon -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
          echo "Release APK built ✅"
          ls -lh app/build/outputs/apk/release/

      - name: 🧪 Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon
          echo "Unit tests passed ✅"

      - name: 📏 APK size summary
        if: always()
        run: |
          echo "## 📦 APK Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "app/build/outputs/apk/debug" ]; then
            echo "### Debug APK" >> $GITHUB_STEP_SUMMARY
            ls -lh app/build/outputs/apk/debug/*.apk | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d "app/build/outputs/apk/release" ]; then
            echo "### Release APK" >> $GITHUB_STEP_SUMMARY
            ls -lh app/build/outputs/apk/release/*.apk | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### 📱 Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "adb install app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: ⬆️ Upload Debug APK
        if: always() && (hashFiles('app/build/outputs/apk/debug/*.apk') != '')
        uses: actions/upload-artifact@v4
        with:
          name: Shadow306-debug-APK-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

      - name: ⬆️ Upload Release APK
        if: always() && (hashFiles('app/build/outputs/apk/release/*.apk') != '')
        uses: actions/upload-artifact@v4
        with:
          name: Shadow306-release-APK-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          compression-level: 0
          if-no-files-found: ignore

      - name: ⬆️ Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  build-bundle:
    name: Build AAB for Play Store
    runs-on: ubuntu-latest
    if: github.event.inputs.build_type == 'both' || github.event.inputs.build_type == 'release'
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔍 Accept licenses & Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute permission
        run: chmod +x gradlew

      - name: 📦 Build Release Bundle (AAB)
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: ⬆️ Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Shadow306-release-AAB-${{ github.sha }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90
          if-no-files-found: warn
