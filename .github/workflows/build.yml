name: Build Shadow306 APK

on:
  push:
    branches: [ main, arena/**, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Original)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: 🔧 Grant execute
        run: chmod +x gradlew

      - name: 🔨 Build Debug APK
        id: build
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "EXIT_CODE=$EXIT_CODE"
          tail -100 /tmp/build.log
          exit $EXIT_CODE

      - name: 📤 Upload build log to gist on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Build failed, creating gist with log ==="
          # Extract last 200 lines with errors
          echo "## Build log for ${{ github.sha }}" > /tmp/gist.log
          echo "" >> /tmp/gist.log
          echo "### Last 200 lines" >> /tmp/gist.log
          tail -200 /tmp/build.log >> /tmp/gist.log
          echo "" >> /tmp/gist.log
          echo "### Errors" >> /tmp/gist.log
          grep -i -E "error|FAILED|exception|e: " /tmp/build.log | head -100 >> /tmp/gist.log || echo "No errors found" >> /tmp/gist.log
          # Create gist
          gh gist create /tmp/gist.log --public --desc "Shadow306 build log ${{ github.sha }} - ${{ github.run_id }}" || echo "Gist creation failed"
          # Also print to summary
          echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 📏 Summary success
        if: success()
        run: |
          echo "## ✅ Shadow306 APK Built - Original Design" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK <50MB, models download after install, then 100% offline" >> $GITHUB_STEP_SUMMARY
          echo "Icon: shadow crescent + purple AI dot adaptive" >> $GITHUB_STEP_SUMMARY
          find app/build -name "*.apk" -type f -exec ls -lh {} \; | while read l; do echo "- $l" >> $GITHUB_STEP_SUMMARY; done

      - name: ⬆️ Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Shadow306-APK-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
